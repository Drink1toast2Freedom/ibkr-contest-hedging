name: deterministic-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hedge
          POSTGRES_PASSWORD: hedge
          POSTGRES_DB: hedge
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock && pip install --no-deps --no-build-isolation -e .
      - run: ruff check hedge tests
      - run: python -m pytest -q
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://hedge:hedge@localhost:5432/hedge
